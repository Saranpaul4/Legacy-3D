<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Legacy — The people who changed the world</title>
    <meta name="google-site-verification" content="4C1C91OEnOmsoVj6GueY2JlvjidNr6l_gQ-mrTbP-z4" />
    <meta
      name="description"
      content="An interactive archive of 32 scientists, leaders, artists, innovators and sports legends. Explore their lives on a 3D globe, follow them through time, compare them and test yourself with a quiz."
    />
    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- apply a saved light theme before the page paints, so it never flashes dark -->
    <script>
      try {
        if (localStorage.getItem('legacy-theme') === 'light')
          document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>

    <!-- Link previews (WhatsApp, LinkedIn, X). These need full web addresses:
         if the site moves to a new domain, change legacy-3-d.vercel.app below. -->
    <link rel="canonical" href="https://legacy-3-d.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Legacy" />
    <meta property="og:url" content="https://legacy-3-d.vercel.app/" />
    <meta property="og:title" content="Legacy — The people who changed the world" />
    <meta
      property="og:description"
      content="Explore the lives of 32 legends on a 3D globe, a six-century timeline and a quiz."
    />
    <meta property="og:image" content="https://legacy-3-d.vercel.app/og-image.jpg" />
    <meta property="og:image:alt" content="Legacy — every life leaves a legacy" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Legacy — The people who changed the world" />
    <meta
      name="twitter:description"
      content="Explore the lives of 32 legends on a 3D globe, a six-century timeline and a quiz."
    />
    <meta name="twitter:image" content="https://legacy-3-d.vercel.app/og-image.jpg" />

    <!-- Fonts: connect early so text appears sooner -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
